# Static site: nothing to compile, the build just copies the site into dist/.
# Netlify serves 404.html for unknown paths.
# dist/ matches the publish directory the old Vite site set in the Netlify UI.
# Add any new top-level file or folder to the copy list below.
[build]
  publish = "dist"
  command = "rm -rf dist && mkdir dist && cp -R index.html 404.html robots.txt sitemap.xml site.webmanifest assets css js vendor dist/"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Self-hosted libraries (three 0.170, gsap 3.13, lenis 1.1.20, cannon-es 0.20).
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

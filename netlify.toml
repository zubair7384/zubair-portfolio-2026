# Static site: no build step. Netlify serves 404.html for unknown paths.
[build]
  publish = "."
  # Overrides any build command set in the Netlify UI (the old Vite site used `npm run build`).
  command = "echo 'No build step'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Self-hosted libraries (three 0.170, gsap 3.13, lenis 1.1.20, cannon-es 0.20).
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

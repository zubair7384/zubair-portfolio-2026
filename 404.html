<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not found — Zubair Iqbal</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    .nf { min-height: 100svh; display: grid; align-content: center; gap: 28px; padding: 120px var(--gutter) 60px; max-width: var(--max); margin-inline: auto; }
    .nf h1 { font-size: clamp(72px, 16vw, 280px); }
    .nf h1 em { font-style: normal; color: var(--emerald); }
    .nf p { font-size: 18px; color: var(--ink-2); max-width: 30em; }
    .nf a.btn { justify-self: start; background: var(--ink); color: var(--paper); padding: 12px 20px; border-radius: 999px; font-weight: 500; }
    .nf a.btn:hover { background: var(--mint); color: var(--ink); }
  </style>
</head>
<body>
  <main class="nf">
    <p class="label">404</p>
    <h1 class="display">no such<br />layer<em>.</em></h1>
    <p>This request fell through the whole stack and found nothing at the bottom. The page may have moved, or never existed.</p>
    <a class="btn" href="/">Back to the top</a>
  </main>
</body>
</html>
